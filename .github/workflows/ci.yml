name: Docker CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🔁 Checkout Code
        uses: actions/checkout@v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # The backend Dockerfile lives at docker/Dockerfile and builds with
      # the repo root as context (it COPYs ".", i.e. backend/, auth/,
      # requirements.txt, etc.) -- "docker build ./backend" pointed at a
      # directory with no Dockerfile at all and always failed.
      - name: 📦 Build Backend Image
        run: docker build -f docker/Dockerfile -t ${{ secrets.DOCKER_HUB_USERNAME }}/travel-backend .

      - name: 📦 Build Frontend Image
        run: docker build -f frontend/Dockerfile -t ${{ secrets.DOCKER_HUB_USERNAME }}/travel-frontend ./frontend

      - name: 🛳️ Push Backend Image
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/travel-backend

      - name: 🛳️ Push Frontend Image
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/travel-frontend

      # requirements.txt is at the repo root; there is no backend/requirements.txt.
      - name:  Run Backend Tests
        run: |
          pip install -r requirements.txt
          pytest backend/tests || echo "No tests yet"
